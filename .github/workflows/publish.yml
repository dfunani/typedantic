# Publishes @typedantic/core → @typedantic/model → @typedantic/settings
# Auth: npm trusted publishing (OIDC) — no NPM_TOKEN.
# bun publish does not support OIDC; pack with Bun (rewrites workspace:*), publish with npm.
# Runbook: documentation/phases/05-ship/distribution.md
name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          # npm trusted publishing needs npm ≥ 11.5.1 (Node ≥ 22.14)
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Ensure npm supports OIDC
        run: |
          npm --version
          node -e "const [maj,min]=require('child_process').execSync('npm -v').toString().trim().split('.').map(Number); if(maj<11||(maj===11&&min<5)) process.exit(1)"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: bun run functional-test
      - run: bun run pack:dry
      - name: Publish packages (OIDC)
        run: |
          set -euo pipefail
          publish_pkg() {
            local cwd="$1"
            rm -f "$cwd"/*.tgz
            bun pm pack --cwd "$cwd" --destination "$cwd"
            npm publish "$cwd"/*.tgz --access public
            rm -f "$cwd"/*.tgz
          }
          publish_pkg packages/typedantic-core
          publish_pkg packages/typedantic
          publish_pkg packages/typedantic-settings
